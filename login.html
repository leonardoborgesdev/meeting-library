<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Meeting Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --bg:oklch(98.8% 0.004 250);--surface-1:oklch(100% 0 0);--surface-2:oklch(97% 0.006 250);--surface-3:oklch(94% 0.008 250);
  --border:oklch(0% 0 0 / 0.08);--border-strong:oklch(0% 0 0 / 0.14);--text:oklch(20% 0.030 250);--text-muted:oklch(48% 0.020 250);--text-dim:oklch(64% 0.015 250);
  --accent:oklch(58% 0.190 258);--accent-fg:oklch(99% 0.004 258);--accent-soft:oklch(95% 0.030 258);--st-review:oklch(60% 0.180 25);--st-posted:oklch(50% 0.130 150);}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:
  radial-gradient(circle at 18% 18%,oklch(85% 0.080 258 / 0.35) 0 16%,transparent 42%),
  radial-gradient(circle at 82% 80%,oklch(88% 0.070 88 / 0.28) 0 20%,transparent 48%),var(--bg);
  color:var(--text);font-family:'Inter',ui-sans-serif,-apple-system,sans-serif;font-size:14.5px;padding:24px}
.card{width:min(400px,94vw);background:var(--surface-1);border:1px solid var(--border);border-radius:18px;padding:30px 28px;
  box-shadow:0 12px 32px oklch(20% 0.030 250 / 0.10),0 4px 12px oklch(20% 0.030 250 / 0.06)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:18px;
  background:radial-gradient(circle at 30% 110%,#ffd76b 0 18%,#ff5a5f 34%,#e14dce 58%,#6751d8 100%)}
.brand .t{font-size:18px;font-weight:600;letter-spacing:-0.02em}
.sub{color:var(--text-muted);font-size:13px;margin-bottom:20px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{padding:8px 14px;font-size:13px;cursor:pointer;color:var(--text-muted);position:relative;background:none;border:none;font-family:inherit}
.tab.active{color:var(--accent);font-weight:500}
.tab.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--accent);border-radius:1px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin:12px 0 5px}
input{width:100%;background:var(--surface-1);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:11px 13px;font-size:14px;font-family:inherit;outline:none;transition:border-color .12s,box-shadow .12s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{width:100%;margin-top:20px;padding:12px;border-radius:9999px;border:none;cursor:pointer;font-size:14px;font-weight:500;font-family:inherit;
  background:var(--accent);color:var(--accent-fg);box-shadow:0 1px 2px oklch(20% 0.030 250 / 0.18),inset 0 1px 0 oklch(100% 0 0 / 0.10);transition:filter .15s}
.btn:hover{filter:brightness(1.05)}.btn:disabled{opacity:.6;cursor:default}
.msg{margin-top:14px;font-size:12.5px;padding:9px 12px;border-radius:9px;display:none}
.msg.err{display:block;background:oklch(96% 0.050 25);color:var(--st-review)}
.msg.ok{display:block;background:oklch(96% 0.040 150);color:var(--st-posted)}
.foot{margin-top:18px;font-size:11px;color:var(--text-dim);text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark">▶</span><span class="t">Meeting Library</span></div>
  <div class="sub">Catálogo de calls · acesso restrito</div>
  <div class="tabs">
    <button class="tab active" id="t-login" onclick="mode('login')">Entrar</button>
    <button class="tab" id="t-reg" onclick="mode('reg')">Registrar</button>
  </div>
  <form id="form" onsubmit="return submitForm(event)">
    <label>Usuário</label>
    <input id="user" autocomplete="username" placeholder="usuário" autofocus>
    <label>Senha</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
    <div id="reg-extra" style="display:none">
      <label>Código de convite</label>
      <input id="code" type="password" placeholder="código de acesso">
    </div>
    <button class="btn" id="submit" type="submit">Entrar</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="foot">Meeting Library</div>
</div>
<script>
let M='login';
function mode(m){M=m;
  document.getElementById('t-login').classList.toggle('active',m==='login');
  document.getElementById('t-reg').classList.toggle('active',m==='reg');
  document.getElementById('reg-extra').style.display=m==='reg'?'':'none';
  document.getElementById('submit').textContent=m==='reg'?'Criar conta':'Entrar';
  document.getElementById('pw').autocomplete=m==='reg'?'new-password':'current-password';
  document.getElementById('msg').className='msg';
}
async function submitForm(e){
  e.preventDefault();
  const btn=document.getElementById('submit'), msg=document.getElementById('msg');
  const body={user:document.getElementById('user').value.trim(),pw:document.getElementById('pw').value};
  if(M==='reg')body.code=document.getElementById('code').value;
  btn.disabled=true;btn.textContent='…';
  try{
    const r=await fetch('/api/'+(M==='reg'?'register':'login'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(d.ok){msg.className='msg ok';msg.textContent='✓ ok, entrando…';location.href='/';return false;}
    msg.className='msg err';msg.textContent=d.error||'Falhou';
  }catch(e){msg.className='msg err';msg.textContent='Servidor indisponível';}
  btn.disabled=false;btn.textContent=M==='reg'?'Criar conta':'Entrar';
  return false;
}
</script>
</body>
</html>
