services:
  postgres:
    image: postgres:16
    container_name: vexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vexa
    volumes:
      - vexa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vexa -d vexa"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vexa-net]

  minio:
    image: minio/minio
    container_name: vexa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - vexa-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [vexa-net]

  vexa-lite:
    image: vexaai/vexa-lite:0.10.6.3-260610-2224
    container_name: vexa-lite
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8056:8056"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      TRANSCRIPTION_SERVICE_URL: ${TRANSCRIPTION_SERVICE_URL}
      TRANSCRIPTION_SERVICE_TOKEN: ${TRANSCRIPTION_SERVICE_TOKEN}
      STORAGE_BACKEND: ${STORAGE_BACKEND}
      SKIP_TRANSCRIPTION_CHECK: ${SKIP_TRANSCRIPTION_CHECK}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: ${MINIO_SECURE}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_SECURE: ${S3_SECURE}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - vexa-recordings:/var/lib/vexa/recordings
    shm_size: "2gb"
    networks: [vexa-net]

networks:
  vexa-net:
    name: vexa-net

volumes:
  vexa-pgdata:
  vexa-recordings:
  vexa-minio:
